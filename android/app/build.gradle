apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {}

android {
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion "34.0.0"
    namespace "com.kidshield"

    defaultConfig {
        applicationId "com.kidshield"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile file("kidshield-release-key.keystore")
            storePassword "KidShield@2024"
            keyAlias "kidshield"
            keyPassword "KidShield@2024"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    // Force AndroidX lifecycle version - ViewModelProvider crash fix
    configurations.all {
        resolutionStrategy {
            force "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
            force "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
            force "androidx.lifecycle:lifecycle-runtime:2.6.2"
            force "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
            force "androidx.lifecycle:lifecycle-livedata:2.6.2"
            force "androidx.lifecycle:lifecycle-common:2.6.2"
            force "androidx.lifecycle:lifecycle-process:2.6.2"
            force "androidx.fragment:fragment:1.6.2"
            force "androidx.activity:activity:1.8.2"
            force "androidx.core:core:1.12.0"
            force "androidx.appcompat:appcompat:1.6.1"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // 🔥 NATIVE SOCKET FOR BACKGROUND STREAMING
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    // Firebase BOM
    implementation(platform("com.google.firebase:firebase-bom:32.7.1"))
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation("com.google.firebase:firebase-messaging")
    implementation("com.google.firebase:firebase-analytics")

    implementation("com.google.android.gms:play-services-location:21.0.1")
	// 🔥 Google CameraX Dependencies for Background Camera
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    
    // Lifecycle Service (CameraX ला lifecycle लागते)
    implementation "androidx.lifecycle:lifecycle-service:2.6.2"
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)